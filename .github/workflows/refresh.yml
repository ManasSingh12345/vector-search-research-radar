name: Refresh Dashboard

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch papers
        run: python arxiv_scrape.py

      - name: Generate topic map
        run: python generate_topic_map.py

      - name: Build dashboard
        run: python build_combined.py

      - name: Commit updated dashboard
        run: |
          cp vsr_dashboard.html index.html
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vsr_dashboard.html index.html
          git diff --cached --quiet || git commit -m "chore: refresh dashboard $(date -u '+%Y-%m-%d')"
          git push
